[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quarto-measurement-report"
version = "0.1.0"
description = "Validated, parameterised Quarto measurement reports"
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.9,<4", "jupyter>=1.1,<2", "PyYAML>=6,<7", "quarto-cli>=1.8,<2", "papermill>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "beautifulsoup4>=4.12,<5", "pypdf>=6,<7"]

[project.scripts]
measurement-report = "quarto_report.cli:main"

[tool.setuptools.package-data]
quarto_report = ["templates/*.qmd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: executes the real Quarto renderer"]
